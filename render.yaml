services:
  - type: web
    name: shipment-board
    env: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipment-db
          property: connectionString

databases:
  - name: shipment-db
    plan: free
